name: Deploy to Cloudflare

# Builds the static bundle from the latest catalog snapshot and deploys it to Cloudflare Workers Static
# Assets. Runs on push to main, daily (to pick up catalog updates), and on demand.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "supabase/**", "**.sql", "Desktop/**", ".github/workflows/desktop_build.yml"]
  schedule:
    - cron: "0 6 * * *" # daily 06:00 UTC — refresh the catalog + redeploy
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Fetch latest catalog snapshot
        env:
          # zemer-search went private (2026-08). The automatic GITHUB_TOKEN is scoped to THIS
          # repo only and cannot read it, so a CORPUS_GH_TOKEN repo secret (a PAT from a
          # collaborator on zemer-search, contents:read) takes priority; the automatic token
          # remains the fallback so a fork/public setup still builds.
          GITHUB_TOKEN: ${{ secrets.CORPUS_GH_TOKEN || secrets.GITHUB_TOKEN }}
        run: node engine/fetch-corpus.mjs
      # A fresh, unguessable folder name per deploy for the bulk catalog files (see emitBulk in
      # engine/build-static.mjs). Masked so it never appears in the public Actions log.
      - name: Private folder name
        id: priv
        run: |
          d="_p$(openssl rand -hex 16)"
          echo "::add-mask::$d"
          echo "dir=$d" >> "$GITHUB_OUTPUT"
      - name: Build static bundle
        env:
          SK_PRIVATE_DIR: ${{ steps.priv.outputs.dir }}
        run: node engine/build-static.mjs
      - name: Deploy to Cloudflare
        if: env.HAS_CF_TOKEN == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          command: deploy --var PRIVATE_DIR:${{ steps.priv.outputs.dir }}
      - name: Skipped deploy (no token)
        if: env.HAS_CF_TOKEN != 'true'
        run: echo "::notice::Built. Add the CLOUDFLARE_API_TOKEN repo secret to enable auto-deploy."
