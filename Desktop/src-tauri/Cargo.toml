[package]
name = "sk-music-desktop"
version = "1.2.0"
description = "SK Music — native desktop shell (Tauri 2) for the kosher Jewish-music web client"
authors = ["SK Music"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Core: system webview + tray. The window loads the deployed web app directly,
# so the Rust side only adds what a browser can't (tray, media keys, deep links, updates).
tauri = { version = "2", features = ["tray-icon"] }

# Focus the running window instead of spawning a second copy. The `deep-link` feature
# is load-bearing: it forwards a 2nd instance's argv so on_open_url fires on Win/Linux.
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Register skmusic:// and route /song/:id etc. into the SPA (wired up in src/deeplink.rs).
tauri-plugin-deep-link = "2"

# Signed auto-update via a minisign-signed manifest on the skmusic origin (wired up in src/updater.rs).
tauri-plugin-updater = "2"

# Launch on login (optionally minimized). Cross-platform: registry Run key on Windows,
# LaunchAgent on macOS, .desktop autostart on Linux (wired up in src/main.rs + src/tray.rs).
tauri-plugin-autostart = "2"

# Native "track changed" toasts while the window is hidden to tray (wired up in src/media.rs).
tauri-plugin-notification = "2"

# Hand off-site links (GitHub, jtechforums, the GPL text…) to the OS default browser — the app
# window has nowhere to put them (wired up in src/deeplink.rs::init_external_links).
tauri-plugin-opener = "2"

# OS media controls: Windows SMTC / macOS Now Playing / Linux MPRIS (wired up in src/media.rs).
souvlaki = "0.7"

# Tray icon: decode the bundled 128px PNG, Lanczos it to tray size, and composite the
# "now playing" badge over it (src/tray.rs). Only the PNG codec is enabled.
image = { version = "0.25", default-features = false, features = ["png"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Offline downloads (src/download.rs): fetch the signed googlevideo audio URL in ranged
# chunks. reqwest is already in the tree (updater plugin); tokio powers the download
# worker's queue channel + extract timeout via tauri::async_runtime (tokio-backed).
reqwest = "0.13"
tokio = { version = "1", features = ["time", "sync"] }

# Taskbar jump list (src/jumplist.rs): ICustomDestinationList + IShellLinkW COM.
# Audio ducking (src/ducking.rs): WASAPI session enumeration + per-session peak meters, plus
# ToolHelp to work out which sessions belong to US (the webview runs in child processes).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_PropertiesSystem",
  "Win32_UI_Shell_Common",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_System_Diagnostics_ToolHelp",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
