<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; connect-src 'self' ipc: http://ipc.localhost" />
<title>SK Music — Updates</title>
<style>
  :root { color-scheme: dark; --bg:#0e0a0b; --surface:#1a1214; --text:#f6ece8; --muted:#b09a93; --faint:#7c6963; --primary:#ff5d6b; --primary-ink:#2a0407; --ok:#67d98a; --line:rgba(255,240,235,.10); }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; background: transparent; }
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--text); -webkit-user-select: none; user-select: none; }
  .card { height: 100%; display: flex; flex-direction: column; padding: 18px 20px 16px; border-radius: 14px; border: 1px solid var(--line);
    background: linear-gradient(160deg, #17100f, var(--bg) 65%); box-shadow: 0 18px 50px -12px rgba(0,0,0,.75); }
  .head { display: flex; align-items: center; gap: 10px; }
  .glyph { width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; font-size: 17px;
    background: linear-gradient(135deg, var(--primary), #f0b35a); color: var(--primary-ink); font-weight: 700; }
  .t { font-weight: 650; font-size: 15px; }
  .ver { color: var(--muted); font-size: 12.5px; }
  .x { margin-left: auto; width: 28px; height: 28px; border: 0; border-radius: 8px; background: transparent; color: var(--faint);
    font-size: 15px; cursor: pointer; }
  .x:hover { background: var(--surface); color: var(--text); }
  .status { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 10px 2px; }
  .line { display: flex; align-items: center; gap: 9px; font-size: 13.5px; color: var(--muted); min-height: 21px; }
  .line b { color: var(--text); font-weight: 600; }
  .spin { width: 15px; height: 15px; border: 2px solid var(--line); border-top-color: var(--primary); border-radius: 50%;
    animation: spin .8s linear infinite; flex: none; display: none; }
  body.busy .spin { display: block; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; display: none; }
  body.ok .dot { display: block; background: var(--ok); }
  body.avail .dot { display: block; background: #f0b35a; }
  body.err .dot { display: block; background: var(--primary); }
  .bar { height: 4px; border-radius: 2px; background: var(--surface); overflow: hidden; display: none; }
  body.downloading .bar { display: block; }
  .bar i { display: block; height: 100%; width: 0; background: var(--primary); transition: width .25s; }
  .notes { font-size: 12px; color: var(--faint); max-height: 34px; overflow: hidden; text-overflow: ellipsis; }
  .row { display: flex; gap: 9px; }
  button.act { flex: 1; height: 36px; border: 0; border-radius: 10px; font: inherit; font-weight: 600; cursor: pointer; }
  #again { background: var(--surface); color: var(--text); border: 1px solid var(--line); }
  #again:hover { border-color: var(--faint); }
  #restart { background: var(--primary); color: #fff; display: none; }
  #restart:hover { filter: brightness(1.08); }
  body.ready #restart { display: block; }
</style>
</head>
<body>
  <div class="card" data-tauri-drag-region>
    <div class="head" data-tauri-drag-region>
      <div class="glyph" data-tauri-drag-region>♪</div>
      <div data-tauri-drag-region>
        <div class="t" data-tauri-drag-region>SK Music</div>
        <div class="ver" data-tauri-drag-region>Version <span id="cur">…</span></div>
      </div>
      <button class="x" id="close" title="Close" aria-label="Close">✕</button>
    </div>
    <div class="status" data-tauri-drag-region>
      <div class="line"><span class="spin"></span><span class="dot"></span><span id="msg">Checking for updates…</span></div>
      <div class="bar"><i id="pct"></i></div>
      <div class="notes" id="notes"></div>
    </div>
    <div class="row">
      <button class="act" id="again">Check again</button>
      <button class="act" id="restart">Restart to update</button>
    </div>
  </div>
<script>
  var T = window.__TAURI__ || {};
  var invoke = T.core ? T.core.invoke : function () { return Promise.reject(); };
  var listen = T.event ? T.event.listen : function () {};
  function el(id) { return document.getElementById(id); }
  function state(cls) { document.body.className = cls; }
  // Render the status line from untrusted event payloads via textContent only — any window
  // (including the remote SPA) can emit a forged updater://* event, so version/message must never
  // reach innerHTML. `lead`/`tail` are static literals; `emphasis` is the dynamic value, bolded.
  function msg(lead, emphasis, tail) {
    var m = el("msg");
    m.textContent = "";
    if (lead) m.appendChild(document.createTextNode(lead));
    if (emphasis != null) {
      var b = document.createElement("b");
      b.textContent = String(emphasis);
      m.appendChild(b);
    }
    if (tail) m.appendChild(document.createTextNode(tail));
  }

  invoke("updater_version").then(function (v) { el("cur").textContent = v; }).catch(function () { el("cur").textContent = "?"; });

  // This window is created and the check starts in the same breath, so a check that resolves before
  // these listeners attach used to land on nobody and leave the dialog spinning "Checking for
  // updates…" with no verdict. Every live event sets `live`, and the startup snapshot below is only
  // painted if none has arrived — so the snapshot can never overwrite fresher news.
  var live = false;
  function render(event, p) {
    p = p || {};
    if (event === "updater://checking") {
      el("cur").textContent = p.currentVersion || el("cur").textContent;
      state("busy"); msg("Checking for updates…"); el("notes").textContent = "";
    } else if (event === "updater://up-to-date") {
      el("cur").textContent = p.currentVersion || el("cur").textContent;
      state("ok"); msg("You're up to date — ", p.currentVersion || "", " is the latest version.");
    } else if (event === "updater://update-available") {
      state("busy avail downloading"); msg("Update available: ", p.version, " — downloading…");
      if (p.notes) el("notes").textContent = p.notes;
    } else if (event === "updater://ready") {
      state("avail ready"); msg(null, p.version, " is downloaded — restart to install.");
    } else if (event === "updater://error") {
      state("err"); msg("Couldn't check for updates. " + (p.message || ""));
    }
  }
  ["updater://checking", "updater://up-to-date", "updater://update-available", "updater://ready", "updater://error"]
    .forEach(function (name) { listen(name, function (e) { live = true; render(name, e.payload); }); });
  listen("updater://download-progress", function (e) {
    if (e.payload.percent != null) el("pct").style.width = e.payload.percent + "%";
  });
  invoke("updater_last_status").then(function (s) {
    if (!live && s && s.event) render(s.event, s.payload);
  }).catch(function () {});

  el("again").onclick = function () { invoke("updater_check"); };
  el("restart").onclick = function () { invoke("updater_restart"); };
  el("close").onclick = function () { T.window && T.window.getCurrentWindow().hide(); };
</script>
</body>
</html>
